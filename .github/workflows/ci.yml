name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - name: Install application and browser
        run: |
          python -m pip install 'setuptools>=82.0.1,<83'
          python -m pip install -e '.[test]'
          python -m playwright install --with-deps chromium
      - name: Compile and check dependencies
        run: |
          python -m compileall -q src scripts tests
          node --check src/capability_runner/static/console.js
          node --check src/capability_runner/static/sandbox.js
          python scripts/check_dependencies.py
      - name: Test real browser, API, policy, and handoff
        run: python -m pytest -q --cov=capability_runner --cov-fail-under=85
      - name: Validate saved evidence and build package
        run: |
          python scripts/check_evidence.py
          python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Run zero-model service demo
        run: python scripts/demo.py
